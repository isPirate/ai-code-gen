server:
  port: 8888
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  application:
    name: ai-code-gen
  profiles:
    active: local
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_gen
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${langchain4j.deepseek.api-key}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-token: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${langchain4j.deepseek.api-key}
      model-name: deepseek-v4-flash
      log-requests: true
      log-responses: true
      max-token: 8192
#      timeout: 600s
      # 解析 reasoning_content，触发 TokenStream.onPartialThinking 回调
      return-thinking: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: cn.pirate.aicodegen.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
